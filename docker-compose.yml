version: "3.9"

services:
  app:
    build: .
    container_name: bayeta_flask
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    networks:
      - bayeta-network

  mongo:
    image: mongo:7.0
    container_name: bayeta_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bayeta-network

networks:
  bayeta-network:

volumes:
  mongo_data:
