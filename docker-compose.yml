version: "3.9"

services:
  bayeta_mongo:
    image: mongo:7
    container_name: bayeta_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  bayeta_flask:
    build: .
    container_name: bayeta_flask
    ports:
      - "5000:5000"
    environment:
      - MONGO_HOST=bayeta_mongo
      - MONGO_PORT=27017
    depends_on:
      - bayeta_mongo

volumes:
  mongo_data:

